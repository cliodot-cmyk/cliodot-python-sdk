[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cliodot"
version = "0.1.0"
description = "Python SDK for Cliodot runtime Apps and Surface capabilities"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Cliodot" }]
dependencies = ["httpx>=0.27,<1"]
keywords = ["cliodot", "sdk", "identity", "oauth", "events", "surface"]

[project.optional-dependencies]
test = ["pytest>=8", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
